<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" id="campusMapSvg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="academicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    
    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Campus Base Plane -->
  <rect width="1000" height="700" fill="url(#bgGrad)" />

  <!-- Grid overlay for technical blueprint aesthetics -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="700" />
    <line x1="200" y1="0" x2="200" y2="700" />
    <line x1="300" y1="0" x2="300" y2="700" />
    <line x1="400" y1="0" x2="400" y2="700" />
    <line x1="500" y1="0" x2="500" y2="700" />
    <line x1="600" y1="0" x2="600" y2="700" />
    <line x1="700" y1="0" x2="700" y2="700" />
    <line x1="800" y1="0" x2="800" y2="700" />
    <line x1="900" y1="0" x2="900" y2="700" />

    <line x1="0" y1="100" x2="1000" y2="100" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="300" x2="1000" y2="300" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="0" y1="500" x2="1000" y2="500" />
    <line x1="0" y1="600" x2="1000" y2="600" />
  </g>

  <!-- Campus Zones / Green Belts -->
  <g id="campusZones">
    <!-- North-West Green Belt -->
    <path d="M 80,80 Q 250,50 320,120 T 150,220 Z" fill="url(#greenGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Central Quad Lawns -->
    <ellipse cx="450" cy="340" rx="90" ry="50" fill="url(#greenGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Central Fountain / Water Basin -->
    <ellipse cx="450" cy="340" rx="28" ry="16" fill="url(#waterGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Sports Complex Track & Field -->
    <rect x="740" y="430" width="160" height="120" rx="40" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6,4"/>
    <ellipse cx="820" cy="490" rx="55" ry="35" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1"/>
  </g>

  <!-- Building Outlines / Visual Footprints -->
  <g id="buildingFootprints">
    <!-- N001 Main Entrance Arch -->
    <rect x="70" y="530" width="60" height="40" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5" opacity="0.8"/>
    <text x="100" y="585" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Main Gate</text>

    <!-- N002 Administrative Headquarters -->
    <rect x="200" y="440" width="120" height="70" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <text x="260" y="475" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Admin Block</text>
    <text x="260" y="492" fill="#60a5fa" font-size="9" text-anchor="middle" font-family="sans-serif">B001 • ADM-01</text>

    <!-- N003 Central University Library -->
    <rect x="390" y="420" width="120" height="75" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
    <text x="450" y="455" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Central Library</text>
    <text x="450" y="472" fill="#a78bfa" font-size="9" text-anchor="middle" font-family="sans-serif">B002 • LIB-01</text>

    <!-- N004 CSE & IT Department Block -->
    <rect x="385" y="175" width="130" height="75" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
    <text x="450" y="210" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">CSE &amp; IT Block</text>
    <text x="450" y="227" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="sans-serif">B003 • ENG-CS</text>

    <!-- N005 ECE & Mechanical Wing -->
    <rect x="595" y="280" width="130" height="75" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
    <text x="660" y="315" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">ECE &amp; Mech Wing</text>
    <text x="660" y="332" fill="#22d3ee" font-size="9" text-anchor="middle" font-family="sans-serif">B004 • ENG-EC</text>

    <!-- N006 Student Center & Canteen -->
    <rect x="220" y="265" width="120" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="280" y="295" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Student Center</text>
    <text x="280" y="312" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="sans-serif">B005 • SAC-01</text>

    <!-- N007 Sports Complex -->
    <text x="820" y="485" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Sports Complex</text>
    <text x="820" y="502" fill="#34d399" font-size="9" text-anchor="middle" font-family="sans-serif">B006 • SPT-01</text>

    <!-- N008 Innovation Hub -->
    <rect x="560" y="110" width="120" height="65" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" opacity="0.9"/>
    <text x="620" y="140" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Innovation Hub</text>
    <text x="620" y="157" fill="#f472b6" font-size="9" text-anchor="middle" font-family="sans-serif">B007 • INC-01</text>

    <!-- N009 Boys Hostel (Aryabhatta) -->
    <rect x="760" y="145" width="120" height="65" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" opacity="0.9"/>
    <text x="820" y="175" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Aryabhatta Hall</text>
    <text x="820" y="192" fill="#fde047" font-size="9" text-anchor="middle" font-family="sans-serif">B008 • HST-01</text>

    <!-- N010 Girls Hostel (Gargi) -->
    <rect x="100" y="125" width="120" height="65" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" opacity="0.9"/>
    <text x="160" y="155" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Gargi Hall</text>
    <text x="160" y="172" fill="#fde047" font-size="9" text-anchor="middle" font-family="sans-serif">B009 • HST-02</text>

    <!-- N012 East Gate -->
    <rect x="890" y="320" width="60" height="40" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5" opacity="0.8"/>
    <text x="920" y="375" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">East Gate</text>

    <!-- N013 Health Center & Parking -->
    <rect x="160" y="590" width="120" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" opacity="0.9"/>
    <text x="220" y="618" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Health Center</text>
    <text x="220" y="633" fill="#f87171" font-size="9" text-anchor="middle" font-family="sans-serif">B010 • MED-01</text>
  </g>

  <!-- Dynamic Graph Layers (Edges and Nodes injected/rendered here by JavaScript) -->
  <g id="graphEdgesLayer"></g>
  <g id="graphNodesLayer"></g>
</svg>
