# Server configuration
server.port=8080

# Spring Application
spring.application.name=smart-campus-optimizer

# Location of JSON data directory relative to backend execution directory
campus.data.dir=../data

# Static resource handling for Vanilla HTML/CSS/JS frontend
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging
logging.level.com.campus=INFO
